<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wizard-multiplayer/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wizard Multiplayer</title>
    <meta name="theme-color" content="#0b1224" />
    <!-- Link previews (iMessage, WhatsApp). functions/index.js swaps the
         title, description and url per room on /room/CODE links. -->
    <meta name="description" content="Play Wizard with the family: one link, any phone." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wizard Multiplayer" />
    <meta property="og:title" content="Wizard Multiplayer" />
    <meta property="og:description" content="Play Wizard with the family: one link, any phone." />
    <meta property="og:url" content="https://wizard-multiplayer.web.app/" />
    <meta property="og:image" content="https://wizard-multiplayer.web.app/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wizard Multiplayer" />
    <meta name="twitter:description" content="Play Wizard with the family: one link, any phone." />
    <meta name="twitter:image" content="https://wizard-multiplayer.web.app/og-card.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Paired with public/404.html: unpack the ?p=/room/ABCD hop back into
      // history before React Router boots, so deep links survive GH Pages.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
